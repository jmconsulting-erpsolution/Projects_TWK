<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benvenuto</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="text-center">

      <input #badgeInput type="text" class="badge-input" [(ngModel)]="badge" (ngModelChange)="onBadgeChange($event)" autocomplete="off" />

      <!-- LOGO -->
      <img [src]="appService.setLogo('./assets/images/')" alt="Logo" class="img-fluid mb-4"
        style="max-width: 500px;">

      <!-- TITOLO -->
      <h1 class="fw-bold">Benvenuto</h1>

      <!-- SOTTOTITOLO -->
      <p class="fs-4 mt-3 text-muted">Scannerizza il badge per proseguire</p>

      <p class="badge-preview">{{ badge }}</p>

    </div>
  </div>

  <!-- Bootstrap JS (opzionale) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
