<!-- TITOLO -->
<div class="table-responsive flex-grow-1">

  <div class="header-row">

    <div class="back-button" (click)="goBack()">
      <img src="./assets/images/arrow.png" alt="Indietro" class="arrow-icon" [style.filter]="appservice.getCompanyFilter()">
    </div>

    <h1 class="titolo-commesse">Commesse</h1>

    <div class="header-spacer"></div>

  </div>

  <div class="items-container-grid">
  <div
    *ngFor="let item of items"
    class="commessa-card"
    (click)="navigate(item)"
  >
    <div
      class="commessa-codice"
      [style.color]="appservice.getCompanyColor()"
    >
      {{ item.No }}
    </div>

    <div class="commessa-descrizione">
      {{ item.Description }}
    </div>
  </div>
</div>

</div>
